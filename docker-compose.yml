services:
  discordless:
    build: .
    restart: unless-stopped
    volumes:
      - ./traffic_archive:/app/traffic_archive:z
      - ./dcejson_exports:/app/dcejson_exports:z
      - ~/.mitmproxy:/root/.mitmproxy:z
    ports:
      - 127.0.0.1:8080:8080
    environment:
      - DISCORDLESS_DB_HOST
      - DISCORDLESS_DB_PORT
      - DISCORDLESS_DB_NAME
      - DISCORDLESS_DB_USER
      - DISCORDLESS_DB_PASSWORD
      - DISCORDLESS_DB_QUEUE_TABLE
      - DISCORDLESS_DB_CONNECT_TIMEOUT_SECONDS

  db-exporter:
    build: .
    restart: unless-stopped
    command: python exporters/db_exporter.py
    environment:
      - DISCORDLESS_DB_HOST
      - DISCORDLESS_DB_PORT
      - DISCORDLESS_DB_NAME
      - DISCORDLESS_DB_USER
      - DISCORDLESS_DB_PASSWORD
      - DISCORDLESS_DB_QUEUE_TABLE
      - DISCORDLESS_DB_MESSAGES_TABLE
      - DISCORDLESS_DB_CONNECT_TIMEOUT_SECONDS
      - DISCORDLESS_DB_EXPORTER_POLL_INTERVAL_SECONDS